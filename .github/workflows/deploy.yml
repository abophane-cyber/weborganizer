# Publie le site sur GitHub Pages à chaque push sur main.
# Il copie les fichiers du site, les numérote (scripts/stamp-version.mjs) pour que
# les navigateurs ne mélangent jamais deux versions, puis les publie.
# Deux tâches (préparer, puis publier), comme le modèle officiel de GitHub :
# la publication ne cherche l'archive qu'une fois la première tâche terminée.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer et numéroter les fichiers du site
        run: |
          mkdir _site
          cp -r index.html sw.js css js _site/
          touch _site/.nojekyll
          node scripts/stamp-version.mjs _site "${GITHUB_SHA::8}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
