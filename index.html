<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Politique de sécurité : seuls les scripts du site s'exécutent ; seules les API pCloud sont contactées. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.pcloud.com; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'">
  <title>WebOrganizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236ea8fe'/%3E%3Cpath d='M8 9h7v7H8zM17 9h7v7h-7zM8 18h7v7H8zM17 18h7v7h-7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"><div id="bg-media"></div><div id="bg-overlay"></div></div>

  <div id="banner"></div>
  <nav id="dock" class="dock" hidden aria-label="Accès rapide"></nav>

  <header class="top">
    <div class="top-text">
      <div id="logo" class="logo movable" data-move="logo" hidden></div>
      <div id="title-block" class="title-block movable" data-move="title">
        <h1 id="title">WebOrganizer</h1>
        <p id="desc"></p>
      </div>
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" aria-label="Rechercher une carte (raccourci : touche /)" title="Rechercher une carte (raccourci : touche /)" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <button id="settings-btn" class="icon-btn settings-btn" type="button" aria-label="Paramètres" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="sync-dot" aria-hidden="true"></span>
    </button>
  </header>

  <main id="board" class="board"></main>

  <footer class="page-footer"><span id="footer"></span></footer>

  <aside id="settings" class="settings" hidden aria-label="Paramètres"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
