<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tests première synchro (dossier simulé)</title>
  <link rel="stylesheet" href="../css/style.css">
  <script type="importmap">{ "imports": { "../js/app-config.js": "./app-config.test.js" } }</script>
  <script src="mock-folder.js"></script>
  <style>#results { position: fixed; left: 12px; bottom: 12px; z-index: 99; margin: 0; padding: 12px; background: #000c; border-radius: 10px; font: 13px/1.5 monospace; white-space: pre; }</style>
</head>
<body>
  <!-- Ouvrir avec ?s=A, ?s=B, ?s=C ou ?s=G : chaque scénario part d'un navigateur vierge. -->
  <div id="bg" aria-hidden="true"><div id="bg-media"></div><div id="bg-overlay"></div></div>
  <div id="banner"></div>
  <nav id="dock" class="dock" hidden></nav>
  <header class="top">
    <div id="clock" class="clock" hidden></div>
    <div class="top-text">
      <div id="logo" class="logo movable" hidden></div>
      <div id="title-block" class="title-block movable"><h1 id="title"></h1><p id="desc"></p></div>
      <div class="search"><input id="search" type="search" aria-label="Rechercher"></div>
    </div>
    <div class="weather"><button id="weather-btn" class="weather-btn" type="button" hidden></button><div id="weather-pop" class="weather-pop" hidden></div></div>
    <button id="fullscreen-btn" class="icon-btn fullscreen-btn" type="button" hidden></button>
    <button id="settings-btn" class="icon-btn settings-btn" type="button" aria-label="Paramètres">⚙<span class="sync-dot"></span></button>
  </header>
  <main id="board" class="board"></main>
  <footer class="page-footer"><span id="footer"></span></footer>
  <aside id="settings" class="settings" hidden></aside>
  <div id="toasts" class="toasts"></div>
  <pre id="results">Tests en cours…</pre>

  <script type="module">
    const scenario = new URLSearchParams(location.search).get('s') || 'A';
    const out = [`Scénario ${scenario}`];
    const check = (name, cond) => { out.push(`${cond ? 'OK   ' : 'ÉCHEC'} ${name}`); document.getElementById('results').textContent = out.join('\n'); };
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const until = async (fn, ms = 5000) => { const t = Date.now(); while (Date.now() - t < ms) { if (await fn()) return true; await wait(40); } return false; };

    await new Promise(r => { const q = indexedDB.deleteDatabase('weborganizer'); q.onsuccess = q.onerror = q.onblocked = r; });
    const { kvSet, mediaPut, mediaGet } = await import('../js/db.js');
    const { defaultConfig } = await import('../js/store.js');
    const M = window.__mock;
    const folderConfig = async () => { const t = await M.read('config.json'); return t ? JSON.parse(t) : null; };

    const realPage = (title) => {
      const c = defaultConfig();
      c.title = title;
      c.updatedAt = '2026-11-16T10:00:00.000Z';
      c.media = { mvid: { name: 'cafe.mp4', mime: 'video/mp4', size: 3, remoteId: null, addedAt: '2026-11-16T09:00:00.000Z' } };
      c.background = { src: 'media:mvid', kind: 'video', overlay: 0.3 };
      return c;
    };

    if (scenario === 'A') {
      // Dossier : page de départ intacte (déposée par un autre profil). Ici : la vraie page.
      M.put('config.json', JSON.stringify(defaultConfig()));
      await kvSet('config', realPage('Ma vraie page'));
      await kvSet('syncMeta', { dirty: true, remoteHash: null, v2: true, v3: true });
      await mediaPut('mvid', new Blob(['abc'], { type: 'video/mp4' }));
    } else if (scenario === 'B') {
      // Dossier : une vraie page (autre ordinateur, avec sa vidéo). Ici : une autre vraie page.
      const other = realPage('Page du dossier'); other.updatedAt = '2026-11-17T08:00:00.000Z';
      other.media = { mpc: { name: 'pc.mp4', mime: 'video/mp4', size: 3, remoteId: 'mpc__pc.mp4', addedAt: '2026-11-16T09:00:00.000Z' } };
      other.background = { src: 'media:mpc', kind: 'video', overlay: 0.3 };
      M.put('config.json', JSON.stringify(other));
      M.put('media/mpc__pc.mp4', new Blob(['xyz'], { type: 'video/mp4' }));
      await kvSet('config', realPage('Ma page locale'));
      await kvSet('syncMeta', { dirty: true, remoteHash: null, v2: true, v3: true });
      await mediaPut('mvid', new Blob(['abc'], { type: 'video/mp4' }));
    } else if (scenario === 'G') {
      // Page envoyée autrefois par l'API pCloud : médias avec un identifiant numérique.
      const legacy = realPage('Page migrée');
      legacy.media.mvid.remoteId = 123456;
      await kvSet('config', legacy);
      await kvSet('syncMeta', { dirty: false, remoteHash: '999', v2: true });   // pas de v3
      await mediaPut('mvid', new Blob(['abc'], { type: 'video/mp4' }));
    } else {
      // Dossier vide, navigateur neuf (page de départ).
    }

    await import('../js/main.js');
    await until(() => window.__wo);
    const { store, sync } = window.__wo;
    await until(() => ['saved', 'error'].includes(sync.getStatus().status), 6000);
    await wait(400);
    await until(() => sync.getStatus().status === 'saved', 4000);

    if (scenario === 'A') {
      check('la vraie page reste affichée', store.get().title === 'Ma vraie page');
      check('la vraie page est enregistrée dans le dossier', (await folderConfig())?.title === 'Ma vraie page');
      check('la vidéo est enregistrée dans media/', M.names('media').some(n => n.endsWith('cafe.mp4')));
    } else if (scenario === 'B') {
      check('première synchro : la page du dossier s’affiche', store.get().title === 'Page du dossier');
      check('… avec sa vidéo lue dans le dossier', await until(async () => !!(await mediaGet('mpc')), 3000));
      const aside = await sync.getAside();
      check('la page locale est mise de côté', aside?.title === 'Ma page locale');
      window.__wo.toggleSettings(true);
      await wait(300);
      window.confirm = () => true;
      const btn = [...document.querySelectorAll('.aside-box button')].find(b => b.textContent === 'Restaurer cette version');
      check('le bouton « Restaurer » est proposé', !!btn);
      btn?.click();
      await wait(200);
      check('après « Restaurer » : la page locale revient', store.get().title === 'Ma page locale');
      await until(async () => (await folderConfig())?.title === 'Ma page locale', 5000);
      check('… et elle est enregistrée dans le dossier', (await folderConfig())?.title === 'Ma page locale');
      check('… avec sa vidéo', M.names('media').some(n => n.endsWith('cafe.mp4')));
    } else if (scenario === 'G') {
      await until(async () => !!(await folderConfig()), 4000);
      check('la page est enregistrée dans le dossier', (await folderConfig())?.title === 'Page migrée');
      check('la vidéo envoyée autrefois par l’API est réécrite dans media/', M.names('media').some(n => n.endsWith('cafe.mp4')));
      check('son identifiant pointe maintenant vers le fichier du dossier', typeof store.get().media.mvid.remoteId === 'string');
    } else {
      check('statut « Enregistré »', sync.getStatus().status === 'saved');
      check('la page de départ n’est PAS enregistrée dans le dossier', !(await folderConfig()));
      store.update(c => { c.title = 'Première modif'; });
      await until(async () => (await folderConfig())?.title === 'Première modif', 5000);
      check('dès la 1re modification, la page est enregistrée', (await folderConfig())?.title === 'Première modif');
    }
    out.push('', 'Terminé.');
    document.getElementById('results').textContent = out.join('\n');
    window.__testsDone = out;
  </script>
</body>
</html>
